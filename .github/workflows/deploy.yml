name: Deploy Demo Dashboard to GitHub Pages

on:
  push:
    branches: [dashboard]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # TEMP: sanity check that secrets are available to the job (no values printed)
      - name: Check build-time envs
        run: |
          echo "Has URL?  $([ -n \"$VITE_SUPABASE_URL\" ] && echo yes || echo no)"
          echo "Has ANON?  $([ -n \"$VITE_SUPABASE_ANON_KEY\" ] && echo yes || echo no)"
          echo "Has DASH?  $([ -n \"$VITE_DASHBOARD_SECRET\" ] && echo yes || echo no)"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DASHBOARD_SECRET: ${{ secrets.VITE_DASHBOARD_SECRET }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DASHBOARD_SECRET: ${{ secrets.VITE_DASHBOARD_SECRET }}

      - name: SPA fallback
        run: cp dist/index.html dist/404.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
