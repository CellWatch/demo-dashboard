name: Deploy Demo Dashboard to GitHub Pages

on:
  push:
    branches: [dashboard]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Check build-time envs
        run: |
          echo "Has API?    $([ -n \"$VITE_API_BASE\" ] && echo yes || echo no)"
          echo "Has BASE?   $([ -n \"$VITE_BASE\" ] && echo yes || echo no)"
          echo "Has URL?    $([ -n \"$VITE_SUPABASE_URL\" ] && echo yes || echo no)"
          echo "Has ANON?   $([ -n \"$VITE_SUPABASE_ANON_KEY\" ] && echo yes || echo no)"
          echo "Has DASH?   $([ -n \"$VITE_DASHBOARD_SECRET\" ] && echo yes || echo no)"
          echo "Has MAPBOX? $([ -n \"$VITE_MAPBOX_TOKEN\" ] && echo yes || echo no)"
        env:
          VITE_API_BASE: https://cellwatch-dashboard-backend-flask.onrender.com
          VITE_BASE: /demo-dashboard/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DASHBOARD_SECRET: ${{ secrets.VITE_DASHBOARD_SECRET }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://cellwatch-dashboard-backend-flask.onrender.com
          VITE_BASE: /demo-dashboard/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_DASHBOARD_SECRET: ${{ secrets.VITE_DASHBOARD_SECRET }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}

      - name: Debug dist
        run: |
          pwd
          ls -la
          ls -la dist

      - name: SPA fallback
        run: cp dist/index.html dist/404.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
