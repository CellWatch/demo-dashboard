name: Deploy backend-preview dashboard

on:
  push:
    branches: [backend-refactor]

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run build
        env:
          VITE_API_BASE: https://demo-dashboard-idtz.onrender.com
          VITE_BASE: /demo-dashboard-backend/

      - name: Deploy to GitHub Pages subfolder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: demo-dashboard/dist
          destination_dir: demo-dashboard-backend